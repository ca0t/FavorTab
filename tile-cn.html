<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  .tile {
    width: 440px; height: 280px;
    background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    position: relative;
  }
  /* 模拟壁纸背景 */
  .tile::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 60%, rgba(100,140,220,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(160,120,220,0.2) 0%, transparent 50%);
  }
  .logo {
    font-size: 42px; font-weight: 700;
    background: linear-gradient(135deg, #a8c0ff, #d4a5ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px; position: relative; z-index: 1;
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 14px; color: rgba(255,255,255,0.55);
    letter-spacing: 2px; position: relative; z-index: 1;
    margin-bottom: 28px;
  }
  .features {
    display: flex; gap: 28px; position: relative; z-index: 1;
  }
  .feat {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .feat-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .feat-text {
    font-size: 11px; color: rgba(255,255,255,0.65);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="tile">
  <div class="logo">FavorTab</div>
  <div class="tagline">极简 · 新标签页</div>
  <div class="features">
    <div class="feat">
      <div class="feat-icon">🖼</div>
      <div class="feat-text">Bing 每日壁纸</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🔍</div>
      <div class="feat-text">多引擎搜索</div>
    </div>
    <div class="feat">
      <div class="feat-icon">📁</div>
      <div class="feat-text">收藏夹网格</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🎨</div>
      <div class="feat-text">可调模糊效果</div>
    </div>
  </div>
</div>
</body>
</html>
